name: linux build
description: helper action to build TrinityCore on Linux
inputs:
  CC:
    default: clang
    description: C compiler to use
    type: string
    required: true
  CXX:
    default: clang++
    description: C++ compiler to use
    type: string
    required: true
  modules:
    default: false
    description: Build with modules enabled
    required: true
    type: boolean
  tools:
    default: none
    description: Build tools (set to any value other than "none" to enable)
    required: false
    type: string
  pch:
    default: false
    description: Enable or disable PCH
    required: false
    type: boolean
  maxerrors:
    default: 1
    description: Max allowed error count before compilation stops
    required: false
    type: number
  keepgoing:
    default: false
    description: Continue build after errors
    required: false
    type: boolean
runs:
  using: composite
  steps:
    - name: Echo cache key
      shell: bash
      run: echo "Cache key -> ccache:${{ runner.os }}:${{ inputs.CC }}_${{ inputs.CXX }}:${{ inputs.modules }}:pch=${{ inputs.pch }}:${{ github.ref_name }}"

    - name: Cache
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/var/ccache
        key: ccache:${{ runner.os }}:${{ inputs.CC }}_${{ inputs.CXX }}:${{ inputs.modules }}:pch=${{ inputs.pch }}:${{ github.ref_name }}
        restore-keys: |
          ccache:${{ runner.os }}:${{ inputs.CC }}_${{ inputs.CXX }}:${{ inputs.modules }}:pch=${{ inputs.pch }}
          ccache:${{ runner.os }}:${{ inputs.CC }}_${{ inputs.CXX }}:${{ inputs.modules }}
          ccache:${{ runner.os }}:${{ inputs.CC }}_${{ inputs.CXX }}

    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ccache cmake make unzip curl build-essential \
          libboost-all-dev libbz2-dev libncurses-dev libreadline-dev \
          libssl-dev zlib1g-dev libmysqlclient-dev

        if [[ "${{ inputs.CC }}" != "gcc" && "${{ inputs.CC }}" != "clang" ]]; then
          sudo apt-get install -y "${{ inputs.CC }}" || true
        fi
        if [[ "${{ inputs.CXX }}" != "g++" && "${{ inputs.CXX }}" != "clang++" ]]; then
          sudo apt-get install -y "${{ inputs.CXX }}" || true
        fi

    - name: Setup ccache
      shell: bash
      env:
        CCACHE_DIR: $GITHUB_WORKSPACE/var/ccache
      run: |
        mkdir -p "$CCACHE_DIR"
        cat <<EOF >> "$GITHUB_ENV"
        CCACHE_BASEDIR=${GITHUB_WORKSPACE}
        CCACHE_DIR=${{ env.CCACHE_DIR }}
        CCACHE_HASHDIR=1
        CCACHE_MAXSIZE=5G
        CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime
        CCACHE_COMPRESS=1
        CCACHE_COMPRESSLEVEL=9
        CCACHE_COMPILERCHECK=content
        CCACHE_LOGFILE=${{ env.CCACHE_DIR }}/cache.debug
        CC=${{ inputs.CC }}
        CXX=${{ inputs.CXX }}
        EOF

    - name: ccache snapshot
      shell: bash
      run: |
        echo "==== Effective ccache configuration ===="
        ccache -p | egrep 'base_dir|hash_dir|compiler_check|sloppiness|max_size' || true
        echo
        echo "==== Compiler info ===="
        which ${{ inputs.CC }} && ${{ inputs.CC }} --version || true
        which ${{ inputs.CXX }} && ${{ inputs.CXX }} --version || true
        echo
        echo "==== Previous cache stats ===="
        ccache -s || true

    - name: Reset ccache stats
      shell: bash
      run: ccache -z || true

    - name: Configure
      shell: bash
      run: |
        set -x
        mkdir build
        cd build
        cmake "$GITHUB_WORKSPACE" \
          -DCMAKE_C_COMPILER="${{ inputs.CC }}" \
          -DCMAKE_CXX_COMPILER="${{ inputs.CXX }}" \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/env/dist" \
          -DSERVERS=1 \
          -DTOOLS=0 \
          -DUSE_MODULES=${{ inputs.modules == 'true' && '1' || '0' }} \
          -DWITH_WARNINGS=1 \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_C_COMPILER_LAUNCHER="ccache" \
          -DCMAKE_C_FLAGS="${{ startsWith(inputs.CC, 'clang') && '-ferror-limit=' || '-fmax-errors=' }}${{ inputs.maxerrors }}" \
          -DCMAKE_CXX_FLAGS="${{ startsWith(inputs.CXX, 'clang') && '-ferror-limit=' || '-fmax-errors=' }}${{ inputs.maxerrors }}" \
          ${{ inputs.pch == 'true' && '' || '-DNOPCH=1' }}

    - name: Build
      shell: bash
      working-directory: "${{ github.workspace }}/build"
      run: |
        cmake --build . --config "Release" -j "$(($(nproc) + 2))" ${{ inputs.keepgoing == 'true' && '-- --keep-going' || '' }}

    - name: Install
      shell: bash
      working-directory: "${{ github.workspace }}/build"
      run: cmake --install . --config "Release"

    - name: Smoke test
      shell: bash
      run: |
        if [[ -x "env/dist/bin/authserver" ]]; then
          env/dist/bin/authserver --version
        fi
        if [[ -x "env/dist/bin/worldserver" ]]; then
          env/dist/bin/worldserver --version
        fi

    - name: ccache stats
      shell: bash
      run: ccache -s || true
