name: windows-build-release

on:
  push:
    paths-ignore:
      - 'sql/**'    

concurrency:
  group: ${{ github.head_ref }} || concat(${{ github.ref }}, ${{ github.workflow }})
  cancel-in-progress: true


env:
  BUILD_TYPE: Release
  REPO_DIR : ${{github.workspace}}
  BUILD_DIR: ${{github.workspace}}/bin/builddir
  BOOST_TOOLSET: "msvc"
  BOOST_VERSION: "1.87.0"
  
jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v5

    - name: Get current OpenSSL version
      id: openssl-info
      run: |
        $VersionsUrl = "https://api.github.com/repos/slproweb/opensslhashes/contents/win32_openssl_hashes.json"
        $Headers = @{
          Accept="application/vnd.github.raw+json"
          Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"
        }
        $openSSL = (Invoke-RestMethod $VersionsUrl -Headers $Headers).files.PSObject.Properties |
          Select-Object -ExpandProperty Value |
          Where-Object { $_.arch -eq 'INTEL' } |
          Where-Object { $_.bits -eq '64' } |
          Where-Object { $_.light -eq $false } |
          Where-Object { $_.installer  -eq 'exe' } |
          Sort-Object -Descending @{ Expression = { [version]$_.basever } } |
          Select-Object -First 1
        [System.String]::Format("cache-key=openssl-{0}-win-{1}-{2}", $openSSL.basever, $openSSL.arch, $openSSL.bits) >> $env:GITHUB_OUTPUT
        [System.String]::Format("url={0}", $openSSL.url) >> $env:GITHUB_OUTPUT

    - name: Cache OpenSSL
      id: cache-openssl
      uses: actions/cache@v4
      with:
        path: C:/libs/openssl
        key: ${{ steps.openssl-info.outputs.cache-key }}

    - name: Download and install Openssl 3.x
      if: ${{ steps.cache-openssl.outputs.cache-hit != 'true' }}
      run: |
        (New-Object System.Net.WebClient).DownloadFile("${{ steps.openssl-info.outputs.url }}", "${{ env.TEMP }}\openssl.exe")
        Start-Process -Wait -FilePath "${{ env.TEMP }}\openssl.exe" "/SILENT","/SP-","/SUPPRESSMSGBOXES",/DIR=C:/libs/openssl

        # Quick Openssl install test
        & C:/libs/openssl/bin/openssl.exe version

    - name: Install boost
      uses: MarkusJx/install-boost@v2.5.1
      id: install-boost
      with:
          # REQUIRED: Specify the required boost version
          # A list of supported versions can be found here: 
          # https://github.com/actions/boost-versions/blob/main/versions-manifest.json
          boost_version: ${{env.BOOST_VERSION}}
          # OPTIONAL: Specify a platform version
          platform_version: 2022         
          # OPTIONAL: Specify a toolset on windows
          toolset: ${{env.BOOST_TOOLSET}}
          # OPTIONAL: Specify a custon install location
          boost_install_dir: ${{env.BOOST_INSTALL_DIR}}
          # NOTE: If a boost version matching all requirements cannot be found,
          # this build step will fail          
    - name: windows dependencies
      run: |
        #make
        choco install -y make
        #cmake
        choco install -y cmake
      #git bash shell
      shell: bash

    - name: Create Build Environment
      run: |
        cmake -E make_directory ${{ env.BUILD_DIR }}

    # build and install
    - name: windows build
      env:
          BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
          OPENSSL_ROOT_DIR: C:/libs/openssl
      run: |
        cd $GITHUB_WORKSPACE

        cmake -S . -B ${{ env.BUILD_DIR }} -A x64
        cmake --build ${{ env.BUILD_DIR }} --config RelWithDebInfo
      #git bash shell
      shell: bash
    - name: Check binaries
      run: |
        cd ${{ env.BUILD_DIR }}/bin/RelWithDebInfo
        
        dir
          copy "C:/Program Files/MySQL/MySQL Server 8.0/lib/libmysql.dll" ${{ env.BUILD_DIR }}/bin/RelWithDebInfo/libmysql.dll
          copy "C:/libs/openssl/bin/libcrypto-3-x64.dll" ${{ env.BUILD_DIR }}/bin/RelWithDebInfo/libcrypto-3-x64.dll
          copy "C:/libs/openssl/bin/libssl-3-x64.dll" ${{ env.BUILD_DIR }}/bin/RelWithDebInfo/libssl-3-x64.dll
          move ${{github.workspace}}/contrib/lua_scripts ${{ env.BUILD_DIR }}/bin/RelWithDebInfo/lua_scripts
        
        ./authserver --version
        ./worldserver --version
